<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-card p-4 p-sm-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="brand-mark" aria-hidden="true">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <div>
                <h1 class="h4 fw-bold mb-0">Student Management</h1>
                <p class="text-secondary small mb-0">Administrator Portal</p>
            </div>
        </div>

        <p class="text-secondary small mb-4">
            Sign in with your administrator username or email to manage student records and view analytics.
        </p>

        <div id="loginErrorAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="usernameOrEmail" class="form-label fw-medium">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input
                        type="text"
                        class="form-control"
                        id="usernameOrEmail"
                        name="usernameOrEmail"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        maxlength="150"
                        required>
                    <div class="invalid-feedback">Please enter your username or email.</div>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        maxlength="128"
                        required>
                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="togglePasswordBtn"
                        aria-label="Show password">
                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="loginBtnText">Sign In</span>
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="/swagger" class="text-decoration-none small text-secondary" target="_blank" rel="noopener">
                <i class="bi bi-code-slash me-1"></i>View API Documentation (Swagger)
            </a>
        </div>
    </main>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
